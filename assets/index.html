<html>
  <body>
    <script type="module">
      import { onCleanup, createSignal } from "https://esm.sh/solid-js@1.8.1";
      import {
        createStore,
        reconcile,
      } from "https://esm.sh/solid-js@1.8.1/store";
      import { render } from "https://esm.sh/solid-js@1.8.1/web";
      import html from "https://esm.sh/solid-js@1.8.1/html";

      const App = () => {
        const [store, setStore] = createStore({
          players: {},
        });

        // const [data, setData] = createSignal({});

        const eventSource = new EventSource("/live");

        eventSource.onmessage = (event) => {
          const jsonData = JSON.parse(event.data);
          console.log(jsonData);
          setStore("players", reconcile(jsonData.players));
        };

        onCleanup(() => eventSource.close());

        return html` <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="2">
                ${Object.entries(store.players).forEach((player) => {
                  player.name;
                })}
              </td>
            </tr>
          </tbody>
        </table>`;
      };

      render(App, document.body);
    </script>
  </body>
</html>
