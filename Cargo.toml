[package]
name = "race_directord"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
insim = { git = "https://github.com/theangryangel/insim.rs.git", branch = "main", default-features = false, features = ['tokio', 'serde'] }
serde = "1.0.209"
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
flume = "0.11.0"
if_chain = "1.0.2"
dashmap = { version = "6.1.0", features = ["serde"] }
parking_lot = { version = "0.12.3", features = ["serde"] }
axum = { version = "0.7.5" }
arraydeque = "0.5.1"
itertools = "0.13.0"
tokio = { version = "1.40.0", features = ["net", "parking_lot", "rt-multi-thread", "io-util", "signal"] }
serde_json = "1.0.128"
anyhow = "1.0.89"
futures = "0.3.30"
tokio-stream = "0.1.16"
tower-http = { version = "0.5.0", features = ["fs", "trace"] }
